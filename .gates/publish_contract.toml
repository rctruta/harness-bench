[[surfaces]]
id = "citation"
status = "planned"
trigger = "CITATION.cff"
why = """
what a reader copies into a bibliography. It carries its own version and \
drifts silently; found three releases stale on this gate's first run in \
another repository."""
# When this goes live:
#   [[surfaces.requires]]
#   kind = "yaml_version_matches_source"
#   path = "CITATION.cff"
#   field = "version"


[[surfaces]]
id = "npm"
status = "planned"
trigger = "package.json"
why = "a Node package on npm"


[[surfaces]]
id = "docker"
status = "planned"
trigger = "Dockerfile"
why = "a published image, whose tag must agree with the release version"


[[surfaces]]
id = "github-action"
status = "planned"
trigger = "action.yml"
why = "a published action, whose declared version must match the tag"
