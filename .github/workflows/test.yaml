name: harness-bench CI

# The job name below becomes the status-check context that branch protection
# requires. Renaming the job silently stops the required check from ever
# arriving, which blocks every merge -- so the name and the protection rule
# are one decision, not two.

on:
  # Manual trigger, so the check can be proven green BEFORE branch
  # protection requires it. Requiring a context that has never run is how a
  # protection rule blocks every merge on day one.
  workflow_dispatch:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"     # pyproject requires >=3.11, <3.14

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run the test suite
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: |
          # Collected from the repository root, matching .githooks/pre-push.
          # Running one directory here would reintroduce the gap that fix
          # closed: 51 of 52 tests, green, with the 52nd never run.
          #
          # --run-paid is deliberately absent. Tests marked `paid` make real
          # billable model calls against three providers; CI must never
          # spend money, and the default skips them.
          pytest -q --no-header
