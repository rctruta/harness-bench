# What runs before every commit.
#
#   pip install pre-commit         install the runner
#   pre-commit run --all-files     run everything now
#   pre-commit autoupdate          move the pinned revs forward
#
# This file is installed as .pre-commit-config.yaml. It is invoked from
# .githooks/pre-commit rather than from .git/hooks, because core.hooksPath
# points at .githooks and git ignores .git/hooks while it does. There is
# therefore no `pre-commit install` step.
#
# Revisions are pinned. An unpinned hook changes what it refuses without a
# diff, which makes a passing commit unreproducible.
#
# These are the general-purpose checks, identical in every repository.
# Repository-specific rules belong in the `local` section at the bottom, or
# in a gate under .gates/ when they need more than a pattern.

repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: check-ast                 # every Python file parses
      - id: detect-private-key
      - id: check-merge-conflict
      - id: check-yaml
      - id: check-toml
      - id: check-added-large-files
      - id: end-of-file-fixer
      - id: trailing-whitespace

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.2
    hooks:
      - id: ruff-check
        # Report only. A linter that edits code on commit changes files the
        # author did not open, which is a decision about style rather than a
        # check for correctness. The rule selection is in ruff.toml.
        args: [--no-fix]

  # Checks that would otherwise be a script. A pattern and a message:
  # pre-commit supplies the file selection, the staging and the reporting.
  #
  # Files are selected by extension, never by directory name. A check
  # pointed at a directory reports clean once the layout changes.
  - repo: local
    hooks:
      - id: no-absolute-home-paths
        name: no absolute home path in a tracked file
        language: pygrep
        entry: '/Users/[A-Za-z0-9._-]+|/home/[A-Za-z0-9._-]+|C:\\Users\\'
        exclude: '^\.pre-commit-config\.yaml$'
